name: Build and deploy Sileo repo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install repository tools
        run: sudo apt-get update && sudo apt-get install -y dpkg-dev bzip2 xz-utils ripgrep

      - name: Build package indexes
        run: bash scripts/build-repo.sh

      - name: Assemble Pages artifact
        run: |
          mkdir public
          cp index.html style.css app.js favicon.svg .nojekyll public/
          cp Packages Packages.gz Packages.bz2 Packages.xz Release public/
          cp -R debs public/debs

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
